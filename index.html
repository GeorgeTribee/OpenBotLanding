<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>OpenBot — Multi-agent coordination platform</title>
    <meta name="title" content="OpenBot — Multi-agent coordination platform" />
    <meta name="description" content="Coordinate specialized AI agents in one shared, local-first, open-source workspace. Browse the agent registry, bring your own keys, and orchestrate complex workflows." />
    <meta name="keywords" content="OpenBot, multi-agent orchestration, AI agent workspace, agent registry, local-first AI, open source AI agents, BYOK, agent coordination, AI automation, OpenAI, Anthropic, Google Gemini" />
    <meta name="author" content="OpenBot Team" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#2a2a2e" />
    <link rel="canonical" href="https://getopenbot.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://getopenbot.com/" />
    <meta property="og:site_name" content="OpenBot" />
    <meta property="og:title" content="OpenBot — Multi-agent coordination platform" />
    <meta property="og:description" content="Stop running agents in isolation. Coordinate specialized AI agents in one shared, local-first, open-source workspace." />
    <meta property="og:image" content="https://getopenbot.com/og-image.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenBot workspace coordinating specialized AI agents" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MeetOpenBot" />
    <meta name="twitter:creator" content="@MeetOpenBot" />
    <meta name="twitter:title" content="OpenBot — Multi-agent coordination platform" />
    <meta name="twitter:description" content="Stop running agents in isolation. Coordinate specialized AI agents in one shared, local-first, open-source workspace." />
    <meta name="twitter:image" content="https://getopenbot.com/og-image.webp" />
    <meta name="twitter:image:alt" content="OpenBot workspace coordinating specialized AI agents" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/openbotlogo.svg" />
    <link rel="shortcut icon" href="/openbotlogo.svg" />

    <!-- Preload hero background (LCP element) -->
    <link rel="preload" as="image" href="/background22.webp" fetchpriority="high" />

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "OpenBot",
      "headline": "Multi-agent coordination platform",
      "description": "Coordinate specialized AI agents in one shared, local-first, open-source workspace. Browse the agent registry, bring your own keys, and orchestrate complex workflows.",
      "applicationCategory": "DeveloperApplication",
      "applicationSubCategory": "Multi-agent AI orchestration",
      "operatingSystem": "macOS, Linux, Windows",
      "url": "https://getopenbot.com",
      "downloadUrl": "https://openbot.one",
      "installUrl": "https://openbot.one",
      "codeRepository": "https://github.com/meetopenbot/openbot",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Local-first architecture — your data stays on your machine",
        "Multi-agent orchestration for complex workflows",
        "Open source and extensible agent SDK",
        "Bring Your Own Keys for OpenAI, Anthropic, Google Gemini, and more",
        "Persistent memory across sessions",
        "Real-time state tracking in a shared workspace",
        "Browse and install agents from the community registry"
      ],
      "screenshot": "https://getopenbot.com/og-image.webp",
      "author": {
        "@type": "Organization",
        "name": "OpenBot",
        "url": "https://getopenbot.com",
        "sameAs": [
          "https://github.com/meetopenbot/openbot",
          "https://x.com/MeetOpenBot",
          "https://discord.gg/XYYXvN2ebB"
        ]
      }
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OpenBot",
      "url": "https://getopenbot.com",
      "logo": "https://getopenbot.com/openbotlogo.svg",
      "description": "The multi-agent coordination platform. Browse the agent registry or build your own agents in a local-first, open-source workspace.",
      "sameAs": [
        "https://github.com/meetopenbot/openbot",
        "https://x.com/MeetOpenBot",
        "https://discord.gg/XYYXvN2ebB"
      ]
    }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OpenBot",
      "url": "https://getopenbot.com",
      "description": "Coordinate specialized AI agents in one shared, local-first, open-source workspace.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://docs.getopenbot.com/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
