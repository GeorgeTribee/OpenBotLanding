<!doctype html>

  <head>

    <meta name="twitter:title" content="OpenBot — The Last Tool You'll Ever Need" />

    <link rel="shortcut icon" href="/openbotlogo.svg" />

    <!-- Preload hero background (LCP element) -->
    <link rel="preload" as="image" href="/background22.webp" fetchpriority="high" />

    <!-- Fonts: preconnect + non-render-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" /></noscript>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "OpenBot",
      "headline": "The Last Tool You'll Ever Need",
      "description": "OpenBot is an AI agent that takes real action — sends messages, writes code, browses the web, manages files, and automates anything. Local-first, works with OpenAI, Anthropic, Google Gemini, and more.",
      "applicationCategory": "DeveloperApplication",
      "applicationSubCategory": "AI Automation",
      "operatingSystem": "macOS, Linux, Windows",
      "url": "https://getopenbot.com",
      "downloadUrl": "https://www.npmjs.com/package/openbot",
      "installUrl": "https://github.com/meetopenbot/openbot#installation",
      "codeRepository": "https://github.com/meetopenbot/openbot",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Send messages on Telegram, WhatsApp, Slack, and 100+ platforms",
        "Browse the web and fill forms autonomously",
        "Write, debug, and deploy code",
        "Manage files and run shell commands",
        "Persistent memory across sessions",
        "Works with OpenAI, Anthropic, Google Gemini, and more",
        "Build custom agents with YAML or TypeScript"
      ],
      "screenshot": "https://getopenbot.com/og-image.webp",
      "author": {
        "@type": "Organization",
        "name": "OpenBot",
        "url": "https://getopenbot.com",
        "sameAs": [
          "https://github.com/meetopenbot/openbot",
          "https://x.com/MeetOpenBot",
          "https://discord.gg/XYYXvN2ebB"
        ]
      }
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OpenBot",
      "url": "https://getopenbot.com",
      "logo": "https://getopenbot.com/openbotlogo.svg",
      "description": "OpenBot is an AI agent platform that takes real action on your behalf.",
      "sameAs": [
        "https://github.com/meetopenbot/openbot",
        "https://x.com/MeetOpenBot",
        "https://discord.gg/XYYXvN2ebB"
      ]
    }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OpenBot",
      "url": "https://getopenbot.com",
      "description": "AI agent that gets work done for you.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://docs.getopenbot.com/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
